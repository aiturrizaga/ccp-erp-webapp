<div class="fixed inset-0 z-40" (click)="close.emit()">
  <div
    class="bg-popover text-popover-foreground ring-foreground/10 absolute start-4 top-14 w-80 rounded-xl p-3 shadow-lg ring-1"
    (click)="$event.stopPropagation()"
  >
    <p class="text-muted-foreground px-1 pb-2 text-xs font-medium tracking-wide uppercase">Apps</p>
    <div class="grid grid-cols-3 gap-1">
      @for (app of apps(); track app.id) {
        <a
          [routerLink]="app.route"
          (click)="close.emit()"
          class="hover:bg-muted flex flex-col items-center gap-1.5 rounded-lg p-3 text-center transition-colors"
        >
          <span class="text-2xl leading-none">{{ app.icon }}</span>
          <span class="text-xs font-medium">{{ app.name }}</span>
          @if (!app.implemented) {
            <span class="text-muted-foreground text-[10px]">Próximamente</span>
          }
        </a>
      }
    </div>
  </div>
</div>
