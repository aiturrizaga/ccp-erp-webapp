<div class="bg-muted/30 flex min-h-svh items-center justify-center p-4">
  <div hlmCard class="w-full max-w-sm p-6">
    <div class="mb-6 flex flex-col items-center gap-2 text-center">
      <div class="bg-sidebar-primary text-sidebar-primary-foreground flex size-10 items-center justify-center rounded-lg font-semibold">CCP</div>
      <div>
        <h1 class="text-lg font-semibold">CCP ERP</h1>
        <p class="text-muted-foreground text-sm">Ingresa con tu cuenta para continuar</p>
      </div>
    </div>

    <form class="flex flex-col gap-3" (submit)="$event.preventDefault(); submit()">
      <div class="flex flex-col gap-1.5">
        <label hlmLabel for="email">Correo</label>
        <input hlmInput id="email" type="email" autocomplete="username" placeholder="nombre@ccp.pe" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label hlmLabel for="password">Contraseña</label>
        <input hlmInput id="password" type="password" autocomplete="current-password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" />
      </div>

      @if (error()) {
        <p class="text-destructive text-sm">Correo o contraseña incorrectos.</p>
      }

      <button hlmBtn type="submit" class="mt-1">Ingresar</button>
    </form>

    <div class="text-muted-foreground mt-6 rounded-lg border border-dashed p-3 text-xs">
      <p class="mb-1 font-medium">Cuentas de prueba</p>
      <p>mvillarreal&#64;ccp.pe — Almacén</p>
      <p>conie&#64;ccp.pe — Logística</p>
      <p>ana&#64;ccp.pe — Ventas</p>
      <p>margot&#64;ccp.pe — Finanzas</p>
      <p>admin&#64;ccp.pe — Todas las apps (demo)</p>
      <p class="mt-1">Contraseña: prueb&#64;s</p>
    </div>
  </div>
</div>
