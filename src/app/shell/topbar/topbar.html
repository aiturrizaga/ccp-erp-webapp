<header class="ccp-topbar shrink-0 border-b">
  <!-- Barra principal: marca CCP + acceso directo a todos los módulos -->
  <div class="ccp-appbar flex h-14 items-stretch border-b">
    <div class="ccp-brand flex w-[220px] shrink-0 items-center border-r px-3">
      <img src="/logo_ccp.png" alt="CCP - Concreto Centrifugado Perú" class="ccp-logo-full" />
    </div>

    <!-- Desktop/tablet horizontal: accesos directos -->
    <nav class="ccp-module-nav ccp-module-nav-desktop flex min-w-0 flex-1 items-stretch overflow-x-auto" aria-label="Módulos del sistema">
      @for (app of apps(); track app.id) {
        <a
          [routerLink]="app.route"
          class="ccp-module-link flex min-w-[104px] shrink-0 items-center justify-center gap-2 border-r px-4 text-sm font-medium transition-colors"
          [class.is-active]="activeAppId() === app.id"
          [attr.title]="app.description"
        >
          <span class="text-lg leading-none">{{ app.icon }}</span>
          <span>{{ app.name }}</span>
        </a>
      }
    </nav>

    <!-- Tablet vertical / móvil: selector de módulos alineado a la derecha -->
    <details class="ccp-module-picker">
      <summary class="ccp-module-picker-trigger" aria-label="Cambiar módulo">
        <span class="ccp-module-picker-icon">▦</span>
        <span class="ccp-module-picker-copy">
          <small>MÓDULO</small>
          <strong>{{ appName() }}</strong>
        </span>
        <span class="ccp-module-picker-chevron">⌄</span>
      </summary>
      <div class="ccp-module-picker-panel">
        @for (app of apps(); track app.id) {
          <a
            [routerLink]="app.route"
            class="ccp-module-picker-item"
            [class.is-active]="activeAppId() === app.id"
            [attr.title]="app.description"
          >
            <span class="ccp-module-picker-item-icon">{{ app.icon }}</span>
            <span>{{ app.name }}</span>
          </a>
        }
      </div>
    </details>

    <div class="ccp-top-actions flex shrink-0 items-center gap-1 px-2">
      <a routerLink="/approvals" class="relative cursor-pointer">
        <button hlmBtn variant="ghost" size="icon" aria-label="Aprobaciones pendientes" class="cursor-pointer">
          <ng-icon name="tablerClipboardCheck" class="text-lg" />
        </button>
        @if (pendingApprovals() > 0) {
          <span hlmBadge variant="destructive" class="absolute -end-1 -top-1 h-4 min-w-4 justify-center px-1 text-[10px]">{{ pendingApprovals() }}</span>
        }
      </a>
      <button hlmBtn variant="ghost" size="icon" aria-label="Notificaciones" class="cursor-pointer">
        <ng-icon name="tablerBell" class="text-lg" />
      </button>
    </div>
  </div>

  <!-- Barra contextual unificada debajo: menú lateral + ubicación + búsqueda -->
  <div class="flex h-11 items-center gap-2 px-3">
    <button hlmSidebarTrigger class="cursor-pointer"></button>
    <hlm-separator orientation="vertical" class="me-1 self-stretch !bg-foreground/15" />

    <nav hlmBreadcrumb class="min-w-0 shrink-0">
      <ol hlmBreadcrumbList>
        <li hlmBreadcrumbItem class="hidden sm:block"><a hlmBreadcrumbLink link="/" class="cursor-pointer">{{ appName() }}</a></li>
        <li hlmBreadcrumbSeparator class="hidden sm:block"></li>
        <li hlmBreadcrumbItem><a hlmBreadcrumbPage>{{ pageLabel() }}</a></li>
      </ol>
    </nav>

    <div class="relative ms-auto hidden w-full max-w-md lg:block">
      <ng-icon name="tablerSearch" class="text-muted-foreground pointer-events-none absolute top-1/2 start-2.5 -translate-y-1/2 text-sm" />
      <input type="search" placeholder="Buscar artículos, órdenes, proveedores..." class="border-input bg-background placeholder:text-muted-foreground focus-visible:ring-ring/50 h-8 w-full rounded-lg border ps-8 pe-3 text-sm outline-none focus-visible:ring-3" />
    </div>
  </div>
</header>
