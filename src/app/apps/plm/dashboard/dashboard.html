<div class="flex flex-col gap-6">
  <div>
    <h1 class="text-xl font-semibold tracking-tight">Dashboard</h1>
    <p class="text-muted-foreground text-sm">Vista general de PLM — productos y listas de materiales.</p>
  </div>

  <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
    <app-stat-card label="Productos activos" [value]="activeProducts() + ''" hint="en el catálogo" />
    <app-stat-card label="BOMs vigentes" [value]="activeBoms() + ''" hint="activas" />
    <app-stat-card label="BOMs en borrador" [value]="draftBoms().length + ''" hint="pendientes de aprobación" />
    <app-stat-card label="BOMs vencidas" [value]="expiredBoms() + ''" hint="requieren renovación" [trend]="expiredBoms() ? 'down' : 'flat'" />
  </div>

  <div class="rounded-lg border">
    <div class="flex items-center justify-between border-b px-4 py-3">
      <h2 class="text-sm font-semibold">BOMs en borrador</h2>
      <a routerLink="/apps/plm/bill-of-materials" class="text-primary text-xs hover:underline">Ver BOMs</a>
    </div>
    <ul class="divide-y">
      @for (b of draftBoms(); track b.id) {
        <li class="flex cursor-pointer items-center justify-between px-4 py-2.5 text-sm hover:bg-muted/50" (click)="goToBom(b.id)">
          <div class="min-w-0">
            <p class="font-medium">{{ b.version }}</p>
            <p class="text-muted-foreground truncate text-xs">{{ productName(b.productId) }}</p>
          </div>
          <span class="text-muted-foreground text-xs whitespace-nowrap">Vigente desde {{ b.effectiveFrom }}</span>
        </li>
      } @empty {
        <li class="text-muted-foreground px-4 py-6 text-center text-sm">Sin BOMs en borrador.</li>
      }
    </ul>
  </div>
</div>
