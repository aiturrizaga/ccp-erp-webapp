<div class="flex flex-col gap-6">
  <div>
    <h1 class="text-xl font-semibold tracking-tight">Dashboard</h1>
    <p class="text-muted-foreground text-sm">Vista general de Finanzas — cuentas por pagar y por cobrar.</p>
  </div>

  <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
    <app-stat-card label="Total por pagar" [value]="'S/ ' + (totalPayable() | number: '1.2-2')" hint="saldo pendiente" />
    <app-stat-card label="Total por cobrar" [value]="'S/ ' + (totalReceivable() | number: '1.2-2')" hint="saldo pendiente" />
    <app-stat-card label="Facturas por pagar vencidas" [value]="overduePayableCount() + ''" hint="requieren pago" [trend]="overduePayableCount() ? 'down' : 'flat'" />
    <app-stat-card label="Facturas por cobrar vencidas" [value]="overdueReceivableCount() + ''" hint="requieren cobro" [trend]="overdueReceivableCount() ? 'down' : 'flat'" />
  </div>
</div>
