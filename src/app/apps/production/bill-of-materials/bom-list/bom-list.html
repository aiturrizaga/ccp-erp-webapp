<app-list-toolbar [(search)]="search" searchPlaceholder="Buscar por producto o versión..." [hasFilters]="true" [filterCount]="filterCount()" actionLabel="Nuevo BOM" (action)="onNew()">
  <div filters class="flex flex-col gap-3">
    <div>
      <p class="text-muted-foreground mb-1.5 text-xs font-medium">Estado</p>
      <div class="flex flex-col gap-1.5">
        @for (opt of statusOptions; track opt.value) {
          <label class="flex cursor-pointer items-center gap-2 text-sm">
            <hlm-checkbox [checked]="statusFilter().has(opt.value)" (checkedChange)="toggleStatusFilter(opt.value)" />
            {{ opt.label }}
          </label>
        }
      </div>
    </div>
    @if (filterCount() > 0) {
      <button hlmBtn variant="ghost" size="sm" class="justify-start gap-1.5" (click)="clearFilters()">
        <ng-icon name="tablerFilter" />
        Limpiar filtros
      </button>
    }
  </div>
</app-list-toolbar>

<app-data-table [columns]="columns" [rows]="paginatedRows()" [rowClickable]="true" (rowClick)="openDetail($event)" emptyMessage="No se encontraron BOM." [cellTemplate]="cellTpl" />
<app-list-pagination [total]="filteredRows().length" [(page)]="page" [(pageSize)]="pageSize" />

<ng-template #cellTpl let-row let-key="key">
  @switch (key) {
    @case ('productName') {
      {{ row.productName }}
    }
    @case ('version') {
      {{ row.bom.version }}
    }
    @case ('effectiveFrom') {
      {{ row.bom.effectiveFrom }}
    }
    @case ('status') {
      <app-status-badge [label]="statusLabel(row.bom.status)" [tone]="statusTone(row.bom.status)" />
    }
  }
</ng-template>
