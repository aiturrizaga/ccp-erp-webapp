<app-list-toolbar
  [(search)]="search"
  searchPlaceholder="Buscar por código o nombre de producto..."
  [views]="views"
  [(view)]="view"
  [hasFilters]="true"
  [filterCount]="filterCount()"
  actionLabel="Nuevo producto"
  (action)="onNew()"
>
  <div filters class="flex flex-col gap-3">
    <div>
      <p class="text-muted-foreground mb-1.5 text-xs font-medium">Estado</p>
      <div class="flex flex-col gap-1.5">
        @for (opt of statusOptions; track opt.value) {
          <label class="flex cursor-pointer items-center gap-2 text-sm">
            <hlm-checkbox [checked]="statusFilter().has(opt.value)" (checkedChange)="toggleStatusFilter(opt.value)" />
            {{ opt.label }}
          </label>
        }
      </div>
    </div>
    @if (filterCount() > 0) {
      <button hlmBtn variant="ghost" size="sm" class="justify-start gap-1.5" (click)="clearFilters()">
        <ng-icon name="tablerFilter" />
        Limpiar filtros
      </button>
    }
  </div>
</app-list-toolbar>

@if (view() === 'list') {
  <app-data-table [columns]="columns" [rows]="paginatedRows()" [rowClickable]="true" (rowClick)="openDetail($event)" emptyMessage="No se encontraron productos." [cellTemplate]="cellTpl" />
} @else {
  <app-data-grid [rows]="paginatedRows()" [cardTemplate]="cardTpl" [rowClickable]="true" (rowClick)="openDetail($event)" emptyMessage="No se encontraron productos." />
}
<app-list-pagination [total]="filteredRows().length" [(page)]="page" [(pageSize)]="pageSize" />

<ng-template #cellTpl let-row let-key="key">
  @switch (key) {
    @case ('status') {
      <app-status-badge [label]="statusLabel(row.status)" [tone]="statusTone(row.status)" />
    }
    @default {
      {{ row[key] }}
    }
  }
</ng-template>

<ng-template #cardTpl let-row>
  <div class="flex items-start justify-between gap-2">
    <p class="text-sm font-medium">{{ row.name }}</p>
    <app-status-badge [label]="statusLabel(row.status)" [tone]="statusTone(row.status)" />
  </div>
  <p class="text-muted-foreground mt-1 text-xs">{{ row.code }} · v{{ row.version }}</p>
</ng-template>
