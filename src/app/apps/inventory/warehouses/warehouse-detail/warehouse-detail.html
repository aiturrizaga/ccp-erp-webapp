@if (warehouse(); as wh) {
  <app-entity-header
    [title]="wh.name"
    [subtitle]="wh.shortName + ' · ' + wh.address"
    [crumbs]="[{ label: 'Almacenes', link: '/apps/inventory/warehouses' }, { label: wh.name }]"
  />

  <div hlmCard class="p-4">
    <h3 class="mb-3 text-sm font-semibold">Ubicaciones</h3>
    <table class="w-full text-sm">
      <thead class="text-muted-foreground border-b text-xs">
        <tr>
          <th class="py-1.5 text-start font-medium">Código</th>
          <th class="py-1.5 text-start font-medium">Nombre corto</th>
          <th class="py-1.5 text-start font-medium">Nombre</th>
        </tr>
      </thead>
      <tbody class="divide-y">
        @for (loc of wh.locations; track loc.id) {
          <tr>
            <td class="py-2 font-medium">{{ loc.code }}</td>
            <td class="py-2">{{ loc.shortName }}</td>
            <td class="py-2">{{ loc.name }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @else {
  <app-empty-state icon="tablerBuildingWarehouse" title="Almacén no encontrado" />
}
