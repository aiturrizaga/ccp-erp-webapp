<app-list-toolbar
  [(search)]="search"
  searchPlaceholder="Buscar por código o nombre..."
  [views]="views"
  [(view)]="view"
  [hasSecondaryActions]="true"
  actionLabel="Nuevo almacén"
>
  <div secondaryActions class="flex flex-col gap-0.5">
    <button hlmBtn variant="ghost" size="sm" class="justify-start gap-2">
      <ng-icon name="tablerDownload" />
      Exportar a Excel
    </button>
  </div>
</app-list-toolbar>

@if (view() === 'list') {
  <app-data-table
    [columns]="columns"
    [rows]="paginatedRows()"
    [rowClickable]="true"
    (rowClick)="openDetail($event)"
    emptyMessage="No se encontraron almacenes."
    [cellTemplate]="cellTpl"
  />
} @else {
  <app-data-grid [rows]="paginatedRows()" [cardTemplate]="cardTpl" [rowClickable]="true" (rowClick)="openDetail($event)" emptyMessage="No se encontraron almacenes." />
}
<app-list-pagination [total]="filteredRows().length" [(page)]="page" [(pageSize)]="pageSize" />

<ng-template #cellTpl let-row let-key="key">
  @switch (key) {
    @case ('locationCount') {
      {{ locationCount(row) }}
    }
    @default {
      {{ row[key] }}
    }
  }
</ng-template>

<ng-template #cardTpl let-row>
  <div class="flex items-start justify-between gap-2">
    <p class="text-sm font-medium">{{ row.name }}</p>
    <span class="text-muted-foreground text-xs">{{ row.shortName }}</span>
  </div>
  <p class="text-muted-foreground mt-1 text-xs">{{ row.address }}</p>
  <p class="text-muted-foreground mt-2 text-xs">{{ locationCount(row) }} ubicaciones</p>
</ng-template>
