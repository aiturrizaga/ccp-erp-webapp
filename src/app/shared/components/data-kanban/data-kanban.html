<div class="flex min-h-0 min-w-0 gap-3 overflow-x-auto pb-2">
  @for (group of columnRows(); track group.column.value) {
    <div class="bg-muted/30 flex w-72 shrink-0 flex-col rounded-lg">
      <div class="flex items-center justify-between px-3 py-2.5">
        <app-status-badge [label]="group.column.label" [tone]="group.column.tone ?? 'neutral'" />
        <span class="text-muted-foreground text-xs">{{ group.rows.length }}</span>
      </div>
      <div class="flex min-h-0 flex-1 flex-col gap-2 overflow-y-auto px-2 pb-2">
        @for (row of group.rows; track $index) {
          <div
            class="bg-card rounded-lg border p-3 transition-colors"
            [class.cursor-pointer]="rowClickable()"
            [class.hover:bg-muted/50]="rowClickable()"
            (click)="onRowClick(row)"
          >
            <ng-container *ngTemplateOutlet="cardTemplate(); context: { $implicit: row }" />
          </div>
        } @empty {
          <p class="text-muted-foreground px-1 py-4 text-center text-xs">Sin registros</p>
        }
      </div>
    </div>
  }
</div>
