<div class="flex h-full min-h-[60vh] flex-col items-center justify-center gap-3 text-center">
  @if (isTablerIcon()) {
    <ng-icon [name]="icon()" class="text-muted-foreground text-4xl" />
  } @else {
    <span class="text-4xl">{{ icon() }}</span>
  }
  <h1 class="text-lg font-semibold">{{ title() }}</h1>
  <p class="text-muted-foreground max-w-md text-sm">{{ description() }}</p>
</div>
