@if (rows().length) {
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3">
    @for (row of rows(); track $index) {
      <div
        class="rounded-lg border p-4 transition-colors"
        [class.cursor-pointer]="rowClickable()"
        [class.hover:bg-muted/50]="rowClickable()"
        (click)="onRowClick(row)"
      >
        <ng-container *ngTemplateOutlet="cardTemplate(); context: { $implicit: row }" />
      </div>
    }
  </div>
} @else {
  <div class="text-muted-foreground rounded-lg border border-dashed p-10 text-center text-sm">{{ emptyMessage() }}</div>
}
