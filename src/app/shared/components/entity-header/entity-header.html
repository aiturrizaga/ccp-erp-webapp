<div class="mb-4 flex flex-col gap-2 border-b pb-4">
  @if (crumbs().length) {
    <nav class="text-muted-foreground flex items-center gap-1.5 text-xs">
      @for (crumb of crumbs(); track crumb.label; let last = $last) {
        @if (crumb.link) {
          <a [routerLink]="crumb.link" class="hover:text-foreground hover:underline">{{ crumb.label }}</a>
        } @else {
          <span [class.text-foreground]="last">{{ crumb.label }}</span>
        }
        @if (!last) {
          <span>/</span>
        }
      }
    </nav>
  }

  <div class="flex flex-wrap items-start justify-between gap-3">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-semibold tracking-tight">{{ title() }}</h1>
      @if (statusLabel(); as label) {
        <app-status-badge [label]="label" [tone]="statusTone()" />
      }
    </div>
    <div class="flex items-center gap-2">
      <ng-content select="[actions]" />
    </div>
  </div>

  @if (subtitle(); as sub) {
    <p class="text-muted-foreground text-sm">{{ sub }}</p>
  }
</div>
